[package]
name = "appmgr"
version = "2.2.1"
edition = "2021"
authors = ["Alex Zahn"]
description = "Universal Linux Application Combine (.deb, .AppImage, .tar.*, .zip, Standalone ELF)"
license = "MIT"
repository = "https://github.com/AleXZahn-max/appmgr"

[features]
default = ["self-update"]
self-update = []

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo", "env"] }
clap_complete = "4.5"
tokio = { version = "1.38", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
ar = "0.9"
tar = "0.4"
flate2 = "1.0"
xz2 = "0.1"
zstd = "0.13"
bzip2 = "0.4"
zip = { version = "2.1", default-features = false, features = ["deflate", "bzip2", "time"] }
goblin = "0.8"
sha2 = "0.10"
hex = "0.4"
regex = "1.10"
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3.10"
walkdir = "2.5"
terminal_size = "0.3"
which = "6.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
