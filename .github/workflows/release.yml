name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            arch: x86_64
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            arch: aarch64
            os: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} --locked

      - name: Package archive
        run: |
          BIN_PATH="target/${{ matrix.target }}/release/appmgr"
          chmod +x "$BIN_PATH"
          ARCHIVE_NAME="appmgr-${{ github.ref_name }}-${{ matrix.arch }}-linux"
          TMP_DIR=$(mktemp -d)
          ARCHIVE_DIR="$TMP_DIR/$ARCHIVE_NAME"
          mkdir -p "$ARCHIVE_DIR/completions" "dist"
          cp "$BIN_PATH" "$ARCHIVE_DIR/"
          cp README.md LICENSE "$ARCHIVE_DIR/"
          "$BIN_PATH" completions bash > "$ARCHIVE_DIR/completions/appmgr.bash"
          "$BIN_PATH" completions zsh > "$ARCHIVE_DIR/completions/_appmgr"
          "$BIN_PATH" completions fish > "$ARCHIVE_DIR/completions/appmgr.fish"
          tar -czf "dist/${ARCHIVE_NAME}.tar.gz" -C "$TMP_DIR" "$ARCHIVE_NAME"
          # Also package standalone binary directly (matching appmgr self-update detection)
          cp "$BIN_PATH" "dist/appmgr-${{ matrix.arch }}-linux"
          chmod +x "dist/appmgr-${{ matrix.arch }}-linux"
          rm -rf "$TMP_DIR"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/appmgr-*-linux

  publish-release:
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Flatten artifacts and generate SHA256SUMS
        run: |
          cd dist
          # Ensure all downloaded files are flattened into dist/ even if nested in artifact subfolders
          find . -mindepth 2 -type f -exec mv -t . {} +
          # Remove any leftover subdirectories
          find . -mindepth 1 -type d -exec rm -rf {} +
          ls -la
          # Generate clean SHA256SUMS for regular release files
          rm -f SHA256SUMS
          for f in appmgr-*-linux *.tar.gz; do
            [ -f "$f" ] && sha256sum "$f"
          done > SHA256SUMS
          cat SHA256SUMS

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/appmgr-*-linux
            dist/SHA256SUMS
          draft: false
          prerelease: false
          generate_release_notes: true
