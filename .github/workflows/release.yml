name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            arch: x86_64
            use_cross: false
          - target: aarch64-unknown-linux-gnu
            arch: aarch64
            use_cross: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build release binary
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} --locked
          else
            cargo build --release --target ${{ matrix.target }} --locked
          fi

      - name: Package archive
        run: |
          BIN_PATH="target/${{ matrix.target }}/release/appmgr"
          chmod +x "$BIN_PATH"
          ARCHIVE_NAME="appmgr-${{ github.ref_name }}-${{ matrix.arch }}-linux"
          mkdir -p "dist/$ARCHIVE_NAME"
          cp "$BIN_PATH" "dist/$ARCHIVE_NAME/"
          cp README.md LICENSE "dist/$ARCHIVE_NAME/"
          mkdir -p "dist/$ARCHIVE_NAME/completions"
          "$BIN_PATH" completions bash > "dist/$ARCHIVE_NAME/completions/appmgr.bash"
          "$BIN_PATH" completions zsh > "dist/$ARCHIVE_NAME/completions/_appmgr"
          "$BIN_PATH" completions fish > "dist/$ARCHIVE_NAME/completions/appmgr.fish"
          cd dist
          tar -czf "${ARCHIVE_NAME}.tar.gz" "$ARCHIVE_NAME"
          # Also package standalone binary directly
          cp "$ARCHIVE_NAME/appmgr" "appmgr-${{ matrix.arch }}-linux"
          chmod +x "appmgr-${{ matrix.arch }}-linux"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/appmgr-*-linux

  publish-release:
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/appmgr-*-linux
            dist/SHA256SUMS
          draft: false
          prerelease: false
          generate_release_notes: true
